<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Todo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Modern Animated-look Mesh Background */
            background-color: #e2e8f0;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
        }

        .box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h2 { font-weight: 600; font-size: 28px; color: var(--text-main); margin-bottom: 8px; }
        p.subtitle { color: #64748b; margin-bottom: 30px; font-size: 14px; }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            box-sizing: border-box;
            background: rgba(255,255,255,0.5);
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            transition: 0.2s;
        }

        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            margin-top: 10px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        #msg { margin-top: 20px; font-size: 13px; color: #ef4444; }
    </style>
</head>
<body>

<div class="box">
    <h2>Todo</h2>
    <p class="subtitle">Focus on what matters.</p>
    
    <input id="email" type="email" placeholder="Email Address">
    <input id="password" type="password" placeholder="Password">
    <input id="name" placeholder="Full Name (Register only)">

    <button class="btn-primary" onclick="login()">Login</button>
    <button class="btn-primary btn-secondary" onclick="register()">Create an Account</button>

    <p id="msg"></p>
</div>

<script src="app.js"></script>
</body>
</html>
